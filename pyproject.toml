[build-system]
requires = ['setuptools>=68', 'wheel']
build-backend = 'setuptools.build_meta'

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
".antlr",
".git",
"**pycache**",
".tox",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
"E",      # pycodestyle errors
"F",      # pyflakes
"W",      # pycodestyle warnings
"I",      # isort/import ordering
"UP",     # pyupgrade
"B",      # flake8-bugbear
"C4",     # flake8-comprehensions
"SIM",    # flake8-simplify
"RET",    # flake8-return
"ARG",    # unused function arguments
"PTH",    # pathlib suggestions
"PL",     # pylint-derived rules
"RUF",    # Ruff-specific rules
"T20",    # print statements
"D",      # pydocstyle/docstrings
]
ignore = [
"D203",   # one-blank-line-before-class; conflicts with D211
"D213",   # multi-line-summary-second-line; conflicts with D212
"PLR0913", # too many arguments; often acceptable in CLI/config boundaries
"PLR2004", # magic value; too noisy during cleanup
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["fuzzmeter"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
"D",        # tests do not need full public docstrings
"PLR2004",  # literal expected values are normal in tests
"ARG",      # fixtures may look unused
]
"**init**.py" = [
"F401",     # allow intentional re-exports
]
