[build-system]
requires = ['setuptools>=68', 'wheel']
build-backend = 'setuptools.build_meta'

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
".antlr",
".git",
"**pycache**",
".tox",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
"E",       # pycodestyle errors
"F",       # pyflakes correctness checks
"W",       # pycodestyle warnings
"I",       # Grammarinator-style import ordering
"B",       # likely bugs from flake8-bugbear
"C4",      # unnecessary or error-prone comprehensions
"ARG001",  # unused arguments of free functions
"PL",      # pylint-derived correctness and maintainability checks
"RUF",     # Ruff-specific correctness checks
"Q000",    # single quotes for inline strings
"Q001",    # single quotes for multiline strings
"D100",    # AGENTS.md: every module needs a file docstring
"D104",    # AGENTS.md: package modules need a file docstring
]
ignore = [
"E501",     # Grammarinator's pycodestyle and pylint both ignore line length
"PLR0911",  # Grammarinator allows complex control-flow boundaries
"PLR0912",
"PLR0913",
"PLR0914",
"PLR0915",
"PLR0916",
"PLR1702",
"PLR2004", # literal values are common in configuration and measurements
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "single"
docstring-quotes = "double"

[tool.ruff.lint.isort]
force-sort-within-sections = false
lines-between-types = 1
known-first-party = ["fuzzmeter"]

[tool.ruff.lint.per-file-ignores]
"fuzzers/**" = [
"ARG001",  # adapter interfaces have fixed callback signatures
"D100",    # external fuzzer integrations may omit module docstrings
"D104",    # empty fuzzer package markers do not need docstrings
]
"tests/**" = [
"ARG001",  # callbacks and test doubles may intentionally ignore arguments
]
"**/__init__.py" = [
"F401",    # allow intentional re-exports
]
# Intentional lazy or platform-specific imports; keep these exact exceptions
# visible and remove them if the import constraints disappear.
"src/fuzzmeter/cli.py" = ["PLC0415"]
"src/fuzzmeter/repro/ingest.py" = ["PLC0415"]
"tests/test_host_cli.py" = ["PLC0415"]

[tool.mypy]
python_version = "3.10"
sqlite_cache = true
warn_unused_configs = true

# Temporary pre-CI type baseline. Overrides preserve checking for every other
# error code and module; each exception is tracked in the baseline report.
# Temporary baseline: 3 pre-CI errors in src/fuzzmeter/cli.py; remove codes as fixed.
[[tool.mypy.overrides]]
module = "fuzzmeter.cli"
disable_error_code = ["arg-type", "union-attr"]

