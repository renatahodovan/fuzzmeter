name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install tox
        run: python -m pip install tox==4.55.0
      - name: Run lint, type, and unit checks
        run: python -m tox run -e lint,type,unit

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
      - name: Install tox
        run: python -m pip install tox==4.55.0
      - name: Enforce coverage ratchet
        run: python -m tox run -e cov
      - name: Publish coverage
        uses: coverallsapp/github-action@v2
        with:
          file: .tox/cov/tmp/coverage.xml
          format: cobertura
          github-token: ${{ secrets.GITHUB_TOKEN }}
