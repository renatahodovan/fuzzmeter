[tox]
env_list = lint, type, unit

[testenv:lint]
description = Run Ruff checks.
package = skip
deps =
    ruff==0.15.16
commands =
    ruff check src tests fuzzers

[testenv:type]
description = Type-check fuzzmeter source code.
changedir = {toxinidir}
package = skip
deps =
    -e {toxinidir}
    mypy==2.1.0
commands =
    mypy src

[testenv:unit]
description = Run fuzzmeter unit tests.
base_python = python3
changedir = {toxinidir}
package = skip
deps =
    -e {toxinidir}
commands =
    python -m unittest discover -s tests
