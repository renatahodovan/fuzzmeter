[tox]
env_list = lint, type, unit, package, package-sdist, cov

[testenv:lint]
description = Run Ruff checks.
package = skip
deps =
    ruff==0.15.16
commands =
    ruff check src tests fuzzers

[testenv:type]
description = Type-check fuzzmeter source code.
changedir = {toxinidir}
package = skip
deps =
    -e {toxinidir}
    mypy==2.1.0
commands =
    mypy src

[testenv:unit]
description = Run fuzzmeter unit tests.
base_python = python3
changedir = {toxinidir}
package = skip
deps =
    -e {toxinidir}
commands =
    python -m unittest discover -s tests

[testenv:package]
description = Verify that the wheel contains all runtime resources.
package = wheel
changedir = {envtmpdir}
commands =
    python -I {toxinidir}/tests/packaging/check_installed_resources.py

[testenv:package-sdist]
description = Verify that the source distribution contains all runtime resources.
package = sdist
changedir = {envtmpdir}
commands =
    python -I {toxinidir}/tests/packaging/check_installed_resources.py

[testenv:cov]
description = Measure unittest coverage and enforce the current ratchet.
base_python = python3
changedir = {toxinidir}
package = skip
deps =
    -e {toxinidir}
    coverage==7.15.4
set_env =
    COVERAGE_FILE = {envtmpdir}/.coverage
commands =
    coverage erase
    coverage run --source=src/fuzzmeter -m unittest discover -s tests
    coverage report --skip-empty --precision=2 --fail-under=78.04
    coverage xml -o {envtmpdir}/coverage.xml
