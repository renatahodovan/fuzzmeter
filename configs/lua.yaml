fuzzers:
  - aflplusplus
  - fuzzer: libfuzzer_entropic
    parent: libfuzzer
    runtime:
      args:
        - -entropic=1
  - fuzzer: grammarinator
    runtime:
      args:
        - --max-depth=25
        - --memo-size 1000
        - --max-tokens=500
  - fuzzer: grafl
    parent: afl_grammarinator
    # replay_trials:
    #   - /path/to/existing/fuzzer/outdir
    runtime:
      env:
        GRAFL_MEMO_SIZE: 1000
        GRAFL_MAX_DEPTH: 25
        GRAFL_MAX_TOKENS: 500
        GRAFL_MAX_TRIM_STEPS: 200
        GRAFL_RANDOM_MUTATORS: 1
targets:
  - lua:fuzz_lua
run:
  time_seconds: 86400
  repetitions: 3
  parallel_jobs: 48
  snapshot:
    every_seconds: 60
    export_every_ticks: 1
    jobs: 8
